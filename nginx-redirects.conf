# ==============================================================
# Nginx 301 Redirect Rules for Huanqiu Ladder AFF
# 适用于 VPS / 宝塔面板 / 独立 Nginx 站点配置引入 (include nginx-redirects.conf;)
# ==============================================================

# 1. 短链 301 永久重定向
location = /go/huanqiuti {
    return 301 https://123pps01.huanqiutiaff.com/#/?code=j5VBUvw0;
}

location = /go/aff {
    return 301 https://123pps01.huanqiutiaff.com/#/?code=j5VBUvw0;
}

# 2. 针对 /go.html 带参请求的 301 状态码重定向
location = /go.html {
    if ($arg_id = "huanqiuti") {
        return 301 https://123pps01.huanqiutiaff.com/#/?code=j5VBUvw0;
    }
    if ($arg_id = "aff") {
        return 301 https://123pps01.huanqiutiaff.com/#/?code=j5VBUvw0;
    }
    if ($arg_id = "tg-huanqiuti") {
        return 301 https://t.me/huanqiuti8899;
    }
    # 默认带参兜底
    if ($args ~* "id=") {
        return 301 https://123pps01.huanqiutiaff.com/#/?code=j5VBUvw0;
    }
}

# 3. 针对 /go/ 前缀所有子路径的通用 301 兜底
location ^~ /go/ {
    return 301 https://123pps01.huanqiutiaff.com/#/?code=j5VBUvw0;
}
